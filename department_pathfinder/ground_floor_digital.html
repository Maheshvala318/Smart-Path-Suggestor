<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ground Floor Diagram</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #fff; font-family: Arial, Helvetica, sans-serif; }
    .wrap { width: 100vw; height: 100vh; overflow: hidden; background: #fff; }
    svg { width: 100%; height: 100%; display: block; background: #fff; }
    .edge { stroke: #8b8b8b; stroke-width: 1.15; stroke-linecap: round; fill: none; }
    .edge-label { fill: #6b6b6b; font-size: 7.5px; text-anchor: middle; dominant-baseline: middle; }
    .edge-label-bg { fill: #fff; opacity: 0.9; }
    .node circle { fill: #fff; stroke: #8b8b8b; stroke-width: 1.05; }
    .node text { font-size: 9px; fill: #2f2f2f; text-anchor: middle; dominant-baseline: middle; }
    .tiny { font-size: 7.8px; fill: #666; }
  </style>
</head>
<body>
  <div class="wrap">
    <svg viewBox="0 0 980 520" aria-label="Ground floor diagram">
      <defs>
        <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
          <path d="M0,0 L8,4 L0,8 Z" fill="#8b8b8b"></path>
        </marker>
      </defs>

      <!-- structure -->
      <line class="edge" x1="71" y1="478" x2="213" y2="478" marker-start="url(#arrow)" marker-end="url(#arrow)" />
      <line class="edge" x1="213" y1="478" x2="213" y2="366" marker-start="url(#arrow)" marker-end="url(#arrow)" />
      <line class="edge" x1="213" y1="366" x2="213" y2="260" marker-start="url(#arrow)" marker-end="url(#arrow)" />
      <line class="edge" x1="213" y1="366" x2="354" y2="366" marker-start="url(#arrow)" marker-end="url(#arrow)" />
      <line class="edge" x1="213" y1="260" x2="65" y2="260" marker-start="url(#arrow)" marker-end="url(#arrow)" />
      <line class="edge" x1="213" y1="260" x2="213" y2="160" marker-start="url(#arrow)" marker-end="url(#arrow)" />
      <line class="edge" x1="213" y1="160" x2="885" y2="160" marker-start="url(#arrow)" marker-end="url(#arrow)" />
      <line class="edge" x1="235" y1="160" x2="235" y2="95" marker-start="url(#arrow)" marker-end="url(#arrow)" />
      <line class="edge" x1="286" y1="160" x2="286" y2="95" marker-start="url(#arrow)" marker-end="url(#arrow)" />
      <line class="edge" x1="342" y1="160" x2="342" y2="95" marker-start="url(#arrow)" marker-end="url(#arrow)" />
      <line class="edge" x1="500" y1="160" x2="500" y2="95" marker-start="url(#arrow)" marker-end="url(#arrow)" />
      <line class="edge" x1="556" y1="160" x2="556" y2="95" marker-start="url(#arrow)" marker-end="url(#arrow)" />

      <line class="edge" x1="213" y1="260" x2="65" y2="260" marker-start="url(#arrow)" marker-end="url(#arrow)" />
      <line class="edge" x1="183" y1="260" x2="183" y2="205" marker-start="url(#arrow)" marker-end="url(#arrow)" />
      <line class="edge" x1="183" y1="260" x2="183" y2="315" marker-start="url(#arrow)" marker-end="url(#arrow)" />
      <line class="edge" x1="135" y1="260" x2="135" y2="315" marker-start="url(#arrow)" marker-end="url(#arrow)" />

      <line class="edge" x1="645" y1="160" x2="645" y2="285" marker-start="url(#arrow)" marker-end="url(#arrow)" />

      <line class="edge" x1="755" y1="38" x2="755" y2="160" marker-start="url(#arrow)" marker-end="url(#arrow)" />
      <line class="edge" x1="755" y1="95" x2="802" y2="95" marker-start="url(#arrow)" marker-end="url(#arrow)" />
      <line class="edge" x1="755" y1="160" x2="885" y2="160" marker-start="url(#arrow)" marker-end="url(#arrow)" />

      <line class="edge" x1="755" y1="160" x2="755" y2="235" marker-start="url(#arrow)" marker-end="url(#arrow)" />

      <!-- edge weights -->
      <g>
        <rect class="edge-label-bg" x="136" y="470" width="12" height="10" rx="2"></rect><text class="edge-label" x="142" y="475">15</text>

        <rect class="edge-label-bg" x="310" y="150" width="12" height="10" rx="2"></rect><text class="edge-label" x="316" y="155">7</text>
        <rect class="edge-label-bg" x="384" y="150" width="12" height="10" rx="2"></rect><text class="edge-label" x="390" y="155">7</text>
        <rect class="edge-label-bg" x="529" y="150" width="12" height="10" rx="2"></rect><text class="edge-label" x="535" y="155">5</text>
        <rect class="edge-label-bg" x="618" y="172" width="12" height="10" rx="2"></rect><text class="edge-label" x="624" y="177">15</text>

        <rect class="edge-label-bg" x="774" y="118" width="12" height="10" rx="2"></rect><text class="edge-label" x="780" y="123">3</text>
        <rect class="edge-label-bg" x="774" y="204" width="12" height="10" rx="2"></rect><text class="edge-label" x="780" y="209">5</text>
      </g>

      <!-- nodes -->
      <g class="node"><circle cx="71" cy="478" r="15"></circle><text x="71" y="478">1</text></g>
      <g class="node"><circle cx="213" cy="478" r="15"></circle><text x="213" y="478">2</text></g>
      <g class="node"><circle cx="213" cy="366" r="15"></circle><text x="213" y="366">3</text></g>
      <g class="node"><circle cx="354" cy="366" r="15"></circle><text x="354" y="366">4</text></g>
      <g class="node"><circle cx="213" cy="260" r="15"></circle><text x="213" y="260">5</text></g>
      <g class="node"><circle cx="183" cy="310" r="13"></circle><text x="183" y="310">6</text></g>

      <g class="node"><circle cx="755" cy="235" r="13"></circle><text x="755" y="235">19</text></g>
      <g class="node"><circle cx="885" cy="160" r="15"></circle><text x="885" y="160">20</text></g>

      <!-- labels -->
      <text class="tiny" x="187" y="353">UP</text>
    </svg>
  </div>
</body>
</html>
